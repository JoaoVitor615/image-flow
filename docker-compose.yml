services:
  # ==========================================
  # Database: PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: imageflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-imageflow}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-imageflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Persistent storage for PostgreSQL data
  pg_data:
  # Shared storage volume ready for uploaded original images and generated variants
  image_storage:
