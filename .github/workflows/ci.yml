name: CI

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    env:
      MIN_COVERAGE: 75.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Compile Packages
        run: go build -v ./...

      - name: Run Unit Tests with Coverage
        run: |
          go test -v -coverprofile=coverage.out ./internal/config/... ./internal/controller/... ./internal/service/... ./internal/storage/... ./internal/queue/... ./internal/processor/... ./internal/worker/...

      - name: Enforce Minimum Code Coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "Current Total Coverage: ${COVERAGE}%"
          echo "Required Minimum Threshold: ${MIN_COVERAGE}%"

          # Write summary to GitHub Actions UI
          echo "### 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Actual Coverage:** \`${COVERAGE}%\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Threshold:** \`${MIN_COVERAGE}%\`" >> $GITHUB_STEP_SUMMARY

          awk -v cov="$COVERAGE" -v min="$MIN_COVERAGE" 'BEGIN {
            if (cov + 0 < min + 0) {
              print "❌ FAILED: Code coverage " cov "% is below threshold of " min "%";
              exit 1;
            }
            print "✅ PASSED: Code coverage meets or exceeds threshold.";
          }'
